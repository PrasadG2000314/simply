name: Deploy to AWS Lightsail

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy to AWS Lightsail via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.LIGHTSAIL_HOST }}
          username: ${{ secrets.LIGHTSAIL_USERNAME }}
          key: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          script: |
            set -e
            echo "🚀 Deploying latest Simply updates to AWS Lightsail..."

            # Ensure deployment directory exists and is owned by current user
            if [ ! -d "/var/www/simply" ]; then
              echo "📁 Creating /var/www/simply directory..."
              sudo mkdir -p /var/www/simply
              sudo chown -R $USER:$USER /var/www/simply
              git clone https://github.com/PrasadG2000314/simply.git /var/www/simply
            fi

            cd /var/www/simply

            echo "📥 Pulling latest code from GitHub main branch..."
            git fetch --all
            git reset --hard origin/main

            # Create certbot volumes explicitly
            echo "🔒 Setting up SSL volumes..."
            sudo docker volume create simply_certbot_etc || true
            sudo docker volume create simply_certbot_www || true

            CERT_DIR="/var/lib/docker/volumes/simply_certbot_etc/_data/live/turnipass.com"

            # If existing cert is a dummy self-signed cert, remove it so Certbot can generate official cert
            if [ -f "$CERT_DIR/fullchain.pem" ]; then
              if sudo openssl x509 -in "$CERT_DIR/fullchain.pem" -text -noout 2>/dev/null | grep -q "Issuer: CN = turnipass.com"; then
                echo "🧹 Removing dummy self-signed certificate to prepare for real Let's Encrypt cert..."
                sudo rm -rf "/var/lib/docker/volumes/simply_certbot_etc/_data/live/turnipass.com"
                sudo rm -rf "/var/lib/docker/volumes/simply_certbot_etc/_data/archive/turnipass.com"
              fi
            fi

            # Stop Nginx if running to free Port 80 for Certbot Standalone
            sudo docker compose stop nginx || true

            # Issue official Let's Encrypt certificate
            echo "🔒 Requesting official browser-trusted Let's Encrypt SSL certificate..."
            sudo docker run --rm \
              -p 80:80 \
              -v simply_certbot_etc:/etc/letsencrypt \
              certbot/certbot certonly --standalone \
              -d turnipass.com -d www.turnipass.com \
              --email admin@turnipass.com --agree-tos --non-interactive || \
            sudo docker run --rm \
              -p 80:80 \
              -v simply_certbot_etc:/etc/letsencrypt \
              certbot/certbot certonly --standalone \
              -d turnipass.com \
              --email admin@turnipass.com --agree-tos --non-interactive || true

            # Fallback: create temporary self-signed cert only if Let's Encrypt failed
            if [ ! -f "$CERT_DIR/fullchain.pem" ]; then
              echo "⚠️ Fallback: Creating temporary self-signed cert..."
              sudo mkdir -p "$CERT_DIR"
              sudo openssl req -x509 -nodes -newkey rsa:2048 -days 1 \
                -keyout "$CERT_DIR/privkey.pem" \
                -out "$CERT_DIR/fullchain.pem" \
                -subj "/CN=turnipass.com"
            fi

            echo "🐳 Building and starting Docker containers..."
            docker compose up -d --build --remove-orphans

            echo "🧹 Cleaning up old Docker images..."
            docker image prune -f

            echo "✅ SSL Deployment completed successfully!"
