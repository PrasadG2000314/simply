name: Deploy to AWS Lightsail

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy to AWS Lightsail via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.LIGHTSAIL_HOST }}
          username: ${{ secrets.LIGHTSAIL_USERNAME }}
          key: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          command_timeout: 10m
          script: |
            set -e
            echo "🚀 Deploying latest Simply updates to AWS Lightsail..."

            # Ensure deployment directory exists and is owned by current user
            if [ ! -d "/var/www/simply" ]; then
              echo "📁 Creating /var/www/simply directory..."
              sudo mkdir -p /var/www/simply
              sudo chown -R $USER:$USER /var/www/simply
              git clone https://github.com/PrasadG2000314/simply.git /var/www/simply
            fi

            cd /var/www/simply

            echo "📥 Pulling latest code from GitHub main branch..."
            git fetch --all
            git reset --hard origin/main

            echo "🐳 Building and deploying Docker containers..."
            docker compose up -d --build --remove-orphans

            echo "🧹 Cleaning up old Docker images..."
            docker image prune -f

            echo "🩺 Running Pipeline Healthcheck Verification..."
            MAX_RETRIES=20
            RETRY_COUNT=0
            HEALTHY=false

            while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
              RETRY_COUNT=$((RETRY_COUNT + 1))
              echo "🔍 Healthcheck attempt $RETRY_COUNT/$MAX_RETRIES..."

              API_STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost/health 2>/dev/null || echo "000")
              WEB_STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost/ 2>/dev/null || echo "000")

              echo "   API: $API_STATUS | Web: $WEB_STATUS"

              if [ "$API_STATUS" = "200" ] && [ "$WEB_STATUS" = "200" ]; then
                echo "✅ Backend API health status: $API_STATUS OK"
                echo "✅ Frontend Web health status: $WEB_STATUS OK"
                HEALTHY=true
                break
              fi

              echo "⏳ Waiting for containers to start up. Retrying in 10s..."
              sleep 10
            done

            if [ "$HEALTHY" = true ]; then
              echo "🎉 Deployment & Healthcheck completed successfully!"
              echo "   Site is live at: http://turnipass.com/"
              echo "   To enable HTTPS, run: sudo bash /var/www/simply/setup-ssl.sh"
            else
              echo "❌ ERROR: Healthcheck failed after $MAX_RETRIES attempts."
              echo "--- Container Status ---"
              docker compose ps
              echo "--- Recent Logs ---"
              docker compose logs --tail=30
              exit 1
            fi
