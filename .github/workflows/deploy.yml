name: Deploy to AWS Lightsail

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy to AWS Lightsail via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.LIGHTSAIL_HOST }}
          username: ${{ secrets.LIGHTSAIL_USERNAME }}
          key: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          script: |
            set -e
            echo "🚀 Deploying latest Simply updates to AWS Lightsail..."

            # Ensure deployment directory exists and is owned by current user
            if [ ! -d "/var/www/simply" ]; then
              echo "📁 Creating /var/www/simply directory..."
              sudo mkdir -p /var/www/simply
              sudo chown -R $USER:$USER /var/www/simply
              git clone https://github.com/PrasadG2000314/simply.git /var/www/simply
            fi

            cd /var/www/simply

            echo "📥 Pulling latest code from GitHub main branch..."
            git fetch --all
            git reset --hard origin/main

            # ─── SSL Auto-Detection ────────────────────────────────────────────
            # Check if SSL certificates already exist in the certbot volume
            SSL_EXISTS=$(docker run --rm -v simply_certbot_etc:/etc/letsencrypt alpine sh -c \
              "test -f /etc/letsencrypt/live/turnipass.com/fullchain.pem && echo yes || echo no" 2>/dev/null || echo "no")

            if [ "$SSL_EXISTS" = "yes" ]; then
              echo "🔒 SSL certificates found! Using HTTPS nginx config."
              cp nginx.ssl.conf nginx.active.conf
            else
              echo "⚠️  No SSL certificates found. Using HTTP-only nginx config."
              echo "   Run 'sudo bash setup-ssl.sh' after deployment to enable HTTPS."
              cp nginx.conf nginx.active.conf
            fi

            echo "🐳 Building and deploying Docker containers..."
            docker compose up -d --build --remove-orphans

            echo "🔄 Reloading Nginx reverse proxy to refresh container IPs..."
            docker compose restart nginx || docker exec simply_nginx nginx -s reload || true

            echo "🧹 Cleaning up old Docker images..."
            docker image prune -f

            echo "🩺 Running Pipeline Healthcheck Verification..."
            MAX_RETRIES=15
            RETRY_COUNT=0
            HEALTHY=false

            while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
              RETRY_COUNT=$((RETRY_COUNT + 1))
              echo "🔍 Healthcheck attempt $RETRY_COUNT/$MAX_RETRIES..."

              API_STATUS=$(curl -k -L -s -o /dev/null -w "%{http_code}" http://localhost/health || true)
              WEB_STATUS=$(curl -k -L -s -o /dev/null -w "%{http_code}" http://localhost/ || true)

              if [ "$API_STATUS" -eq 200 ] && [ "$WEB_STATUS" -eq 200 ]; then
                echo "✅ Backend API health status: $API_STATUS OK"
                echo "✅ Frontend Web health status: $WEB_STATUS OK"
                HEALTHY=true
                break
              fi

              echo "⏳ Waiting for containers to start up (API: $API_STATUS, Web: $WEB_STATUS). Retrying in 5s..."
              sleep 5
            done

            if [ "$HEALTHY" = true ]; then
              echo "🎉 Deployment & Healthcheck verification completed successfully!"
              if [ "$SSL_EXISTS" = "yes" ]; then
                echo "   🔒 Site is live at: https://turnipass.com/"
              else
                echo "   ⚠️  Site is live at: http://turnipass.com/ (HTTP only)"
                echo "   🔒 To enable HTTPS, SSH into the server and run: sudo bash /var/www/simply/setup-ssl.sh"
              fi
            else
              echo "❌ ERROR: Healthcheck failed after $MAX_RETRIES attempts. Displaying recent logs:"
              docker compose logs --tail=50
              exit 1
            fi
