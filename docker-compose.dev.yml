services:
  # ─── MongoDB Database (Dev) ───────────────────────────────────────────────────
  db:
    image: mongo:7-jammy
    container_name: simply_dev_db
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: simply_db
    ports:
      - "27017:27017"
    volumes:
      - dev_mongodb_data:/data/db
    networks:
      - simply_dev_network

  # ─── Express Backend API (Dev with Hot Reloading) ───────────────────────────
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: simply_dev_api
    restart: unless-stopped
    command: npm run dev
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=development
      - PORT=5000
      - MONGO_URI=mongodb://db:27017/simply_db
      - JWT_SECRET=dev_jwt_secret_key_12345
      - JWT_EXPIRES_IN=7d
      - FRONTEND_URL=http://localhost:3000
      - ADMIN_USERNAME=admin
      - ADMIN_PASSWORD=admin
      - ADMIN_JWT_SECRET=dev_admin_jwt_secret_12345
    volumes:
      - ./backend:/app
      - /app/node_modules
      - dev_uploads_data:/app/uploads
    depends_on:
      - db
    networks:
      - simply_dev_network

  # ─── Next.js Frontend (Dev with Hot Reloading) ──────────────────────────────
  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:5000/api
    container_name: simply_dev_web
    restart: unless-stopped
    command: npm run dev
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - PORT=3000
      - NEXT_PUBLIC_API_URL=http://localhost:5000/api
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - api
    networks:
      - simply_dev_network

volumes:
  dev_mongodb_data:
  dev_uploads_data:

networks:
  simply_dev_network:
    driver: bridge
