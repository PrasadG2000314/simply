services:
  # ─── MongoDB Database ────────────────────────────────────────────────────────
  db:
    image: mongo:7-jammy
    container_name: simply_db
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: simply_db
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - simply_network

  # ─── Express Backend API ──────────────────────────────────────────────────────
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: simply_api
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=5000
      - MONGO_URI=mongodb://db:27017/simply_db
      - JWT_SECRET=change_this_to_a_strong_random_secret_in_production
      - JWT_EXPIRES_IN=7d
      - FRONTEND_URL=http://localhost
      - ADMIN_USERNAME=admin
      - ADMIN_PASSWORD=simply@admin2024
      - ADMIN_JWT_SECRET=admin_super_secret_change_in_production
    expose:
      - "5000"
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      - db
    networks:
      - simply_network

  # ─── Next.js Frontend ────────────────────────────────────────────────────────
  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Baked into the Next.js bundle at build time
        NEXT_PUBLIC_API_URL: /api
    container_name: simply_web
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3000
    expose:
      - "3000"
    depends_on:
      - api
    networks:
      - simply_network

  # ─── Nginx Reverse Proxy ──────────────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: simply_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - web
      - api
    networks:
      - simply_network

# ─── Persistent Volumes ───────────────────────────────────────────────────────
volumes:
  mongodb_data:
  uploads_data:

# ─── Network ─────────────────────────────────────────────────────────────────
networks:
  simply_network:
    driver: bridge
